<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Out – Q1</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Sans+MS&family=Tan+Nimbus&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="quiz-common.css">
  <style>
    :root { --grad-1: #ff0080; --grad-2: #ffff00; --bg-photo: url('allout.jpeg'); }
  </style>
</head>
<body>

<audio id="bg-music" src="personality-theme.mp3" loop></audio>

<div class="container">
  <h1>What would you wear to a grocery store at 3AM?</h1>

  <div class="options">
    <div class="option">A sequined jumpsuit</div>
    <div class="option">Neon cargo pants and fur coat</div>
    <div class="option">An LED jacket with platform shoes</div>
    <div class="option">All of the above, with glitter on top</div>
  </div>

  <button id="nextBtn">Next</button>
</div>

<script src="quiz-common.js"></script>
<script>
  // All Out: the chaos escalates with every question - Q1 is a mild jolt,
  // by Q5 the whole screen is losing it, matching the "maximalist" identity.
  initQuizQuestion({
    pathName: 'allout',
    questionNumber: 1,
    nextPage: 'allout-q2.html',
    emoji: '🔥',
    confettiCount: 8,
    onSelect: () => screenShake(6, 350)
  });
</script>

</body>
</html>
