<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home | Games + Personality Paths</title>
<style>
  :root{
    --glass: rgba(0,0,0,.45);
    --border: rgba(255,255,255,.25);
    --cardFront:#1d1f27;
    --cardBack:#fafafa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family: Arial, sans-serif;color:#fff}

  /* Background video */
  #bg-video{
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:cover; z-index:-2;
  }
  /* Soft dark veil for readability */
  #veil{
    position:fixed; inset:0; background: var(--glass); z-index:-1;
  }

  /* Heading (Comic Sans) */
  .heading{
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    font-family:"Comic Sans MS", "Comic Sans", cursive, sans-serif;
    font-weight:900; font-size:clamp(18px, 2.2vw, 28px);
    background: rgba(0,0,0,.6);
    padding:.6rem 1rem; border-radius:14px; text-align:center;
    border:1px solid var(--border);
    z-index:5;
  }

  /* Music control */
  .audio-toggle{
    position:fixed; top:12px; right:12px; z-index:6;
    background:rgba(0,0,0,.6); border:1px solid var(--border);
    color:#fff; padding:.4rem .7rem; border-radius:10px; cursor:pointer;
    font-size:14px
  }

  /* Layout */
  .container{
    display:flex; width:100%; height:100%;
  }
  .left{
    flex:1.25; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:14px;
  }
  .right{
    flex:1; display:grid; gap:10px; padding:14px;
    /* Five rows so all 5 are visible on desktop without scrolling */
    grid-template-columns: 1fr;
    grid-template-rows: repeat(5, 1fr);
    align-items:stretch; justify-items:stretch;
    min-width:280px;
  }

  /* Personality tiles */
  .tile{
    display:grid; grid-template-rows: 1fr auto;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    border-radius:14px; overflow:hidden;
    backdrop-filter: blur(4px);
  }
  .tile a{display:block; width:100%; height:100%}
  .thumb{
    width:100%; height:100%; object-fit:cover; display:block;
    transition: transform .25s ease;
  }
  .tile:hover .thumb{ transform: scale(1.04); }
  .label{
    padding:8px 10px; text-align:center; font-weight:700; font-size:clamp(12px,1.6vw,16px);
    background:rgba(0,0,0,.35);
  }

  /* LEFT — Memory game (DOM cards) */
  #memoryGame{
    width:min(92%, 520px);
    display:grid;
    gap:10px;
    /* 3 columns x 6 rows = 18 cards (9 names x 2) */
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 1fr;
    perspective:1000px;
  }
  .card{
    position:relative; border-radius:12px; cursor:pointer; user-select:none;
    transform-style:preserve-3d;
  }
  .inner{
    position:relative; width:100%; height:0; padding-top:130%;
    transform-style:preserve-3d; transition: transform .5s ease, opacity .35s ease;
    border:1px solid var(--border); border-radius:12px; overflow:hidden;
    background:rgba(255,255,255,.08);
  }
  .front,.back{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; border-radius:12px;
    padding:10px; text-align:center;
  }
  .front{
    background: var(--cardFront);
    border:2px solid #fff;
    font-family:"Comic Sans MS", "Comic Sans", cursive, sans-serif;
    font-weight:900; font-size: clamp(28px, 5vw, 40px);
  }
  .front span{ display:block; transform: translateZ(1px); }
  .back{
    background: var(--cardBack); color:#111; transform: rotateY(180deg);
    font-weight:800; font-size: clamp(12px, 1.6vw, 16px); line-height:1.2;
  }
  .flipped .inner{ transform: rotateY(180deg); }
  .matched .inner{ opacity:0; pointer-events:none; transform: rotateY(180deg) scale(.92); }

  /* Space Invaders canvas + status line */
  #gameCanvas{
    display:none; /* hidden until memory game ends */
    width:min(92%, 520px); height:auto; aspect-ratio: 1 / 1;
    background:#000; border:3px solid #fff; border-radius:12px;
  }
  #status{
    min-height:38px; text-align:center; font-weight:700; font-size:clamp(13px,1.8vw,16px);
  }

  /* Small screens */
  @media (max-width: 900px){
    .container{ flex-direction:column; }
    .left{ order:2; padding:10px; }
    .right{
      order:1;
      height:44vh;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 1fr;
    }
    #memoryGame{ width:min(96%, 420px); grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

  <!-- Background video -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="loop-bg.mp4" type="video/mp4" />
  </video>
  <div id="veil"></div>

  <!-- Heading -->
  <div class="heading">Hey! Since you came here, play a game and find out your outfit too.</div>

  <!-- Music + toggle -->
  <audio id="bg-music" autoplay loop>
    <source src="running out of time.mp3" type="audio/mpeg" />
  </audio>
  <button class="audio-toggle" id="audioToggle">🔊 On</button>

  <div class="container">
    <!-- LEFT: Games -->
    <section class="left">
      <div id="status">Match all the pairs to unlock the next game.</div>

      <!-- Memory Flip Game -->
      <div id="memoryGame"></div>

      <!-- Space Invaders Canvas -->
      <canvas id="gameCanvas" width="520" height="520"></canvas>
    </section>

    <!-- RIGHT: Personality paths (5 tiles) -->
    <aside class="right">
      <div class="tile">
        <a href="allout-q1.html" title="All Out">
          <img class="thumb" src="allout.png" alt="All Out">
        </a>
        <div class="label">All Out</div>
      </div>
      <div class="tile">
        <a href="somewhat-q1.html" title="Somewhat Out">
          <img class="thumb" src="somewhat.png" alt="Somewhat Out">
        </a>
        <div class="label">Somewhat Out</div>
      </div>
      <div class="tile">
        <a href="maybe-q1.html" title="Maybe">
          <img class="thumb" src="maybe.png" alt="Maybe">
        </a>
        <div class="label">Maybe</div>
      </div>
      <div class="tile">
        <a href="never-q1.html" title="Never">
          <img class="thumb" src="never.png" alt="Never">
        </a>
        <div class="label">Never</div>
      </div>
      <div class="tile">
        <a href="twosides-q1.html" title="Two Sides of the Same Coin">
          <img class="thumb" src="twosides.png" alt="Two Sides of the Same Coin">
        </a>
        <div class="label">Two Sides</div>
      </div>
    </aside>
  </div>

<script>
/* ===== Background music controls (starts reliably after any click/touch) ===== */
const audio = document.getElementById('bg-music');
const audioToggle = document.getElementById('audioToggle');
function setAudioLabel(){
  audioToggle.textContent = audio.muted ? "🔇 Off" : "🔊 On";
}
document.addEventListener('pointerdown', async () => {
  try { await audio.play(); } catch(e) {/* autoplay may still be blocked until user taps again */ }
}, {once:true});
audioToggle.addEventListener('click', ()=>{
  audio.muted = !audio.muted; setAudioLabel();
});
setAudioLabel();

/* ===== Memory Flip Card Game (WORDS, with 'N' on front) ===== */
const memoryHost = document.getElementById('memoryGame');
const statusEl = document.getElementById('status');

const DESIGN_NAMES = [
  "Lorem Ipsum",
  "Your Toast",
  "Cake Was A Lie",
  "Grapefruit x Lime",
  "Burning desire",
  "Initial D",
  "Not the Og",
  "Berserk",
  "Almost but Nope"
];
// Use all 9 => 18 cards
const deck = shuffle([...DESIGN_NAMES, ...DESIGN_NAMES]);

let lock = false;
let first = null;
let matches = 0;

function buildMemoryGrid(){
  memoryHost.innerHTML = '';
  deck.forEach(name=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = name;

    const inner = document.createElement('div');
    inner.className = 'inner';

    const front = document.createElement('div');
    front.className = 'front';
    const frontText = document.createElement('span');
    frontText.textContent = 'N';
    front.appendChild(frontText);

    const back = document.createElement('div');
    back.className = 'back';
    back.textContent = name;

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);
    memoryHost.appendChild(card);

    card.addEventListener('click', ()=>{
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');

      if(!first){
        first = card;
      }else{
        // second card
        const second = card;
        lock = true;
        if(first.dataset.name === second.dataset.name){
          // match
          setTimeout(()=>{
            first.classList.add('matched');
            second.classList.add('matched');
            matches++;
            first = null; lock = false;

            if(matches === DESIGN_NAMES.length){
              // Completed memory game
              statusEl.innerHTML = "You have uncovered most of the designs. Congratulations on playing this beautiful game.";
              setTimeout(()=>{
                statusEl.innerHTML = "Uh-uh, not so fast. Sure, this game is over, but you can play another game.";
                // swap to Space Invaders
                setTimeout(startSpaceInvaders, 1600);
              }, 1600);
            }
          }, 350);
        }else{
          // no match
          setTimeout(()=>{
            first.classList.remove('flipped');
            second.classList.remove('flipped');
            first = null; lock = false;
          }, 800);
        }
      }
    });
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

buildMemoryGrid();

/* ===== Space Invaders (retro blocks) ===== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const LEVEL_NAMES = [...DESIGN_NAMES]; // 9 levels, same order

let ship, bullets, invaders, dir, dropTimer, level, speed;

function startSpaceInvaders(){
  // hide memory, show canvas
  memoryHost.style.display = 'none';
  canvas.style.display = 'block';

  level = 0;
  initLevel();
  requestAnimationFrame(loop);
  // controls
  window.addEventListener('keydown', keydown);
  window.addEventListener('keyup', keyup);
}

function initLevel(){
  // Status line
  statusEl.textContent = `Level ${level+1}: ${LEVEL_NAMES[level]}`;

  // Player
  ship = { x: canvas.width/2 - 22, y: canvas.height - 40, w: 44, h: 18, vx: 0 };

  // Bullets and invaders
  bullets = [];
  invaders = [];
  const cols = 8, rows = 4;
  const startX = 40, startY = 50, gapX = 50, gapY = 38;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      invaders.push({ x: startX + c*gapX, y: startY + r*gapY, w: 28, h: 18 });
    }
  }
  dir = 1; // 1 right, -1 left
  speed = 1.2 + level * 0.35; // speed up per level
  dropTimer = 0;
}

const keys = {};
function keydown(e){ keys[e.code] = true; }
function keyup(e){ keys[e.code] = false; }

function shoot(){
  // limit simultaneous bullets
  if(bullets.length < 5){
    bullets.push({ x: ship.x + ship.w/2 - 1, y: ship.y - 6, w: 3, h: 10, vy: -6 });
  }
}

function update(dt){
  // Ship movement
  ship.vx = 0;
  if(keys['ArrowLeft']) ship.vx = -4.2;
  if(keys['ArrowRight']) ship.vx = 4.2;
  ship.x += ship.vx;
  ship.x = Math.max(6, Math.min(canvas.width - ship.w - 6, ship.x));

  if(keys['Space']) shoot();

  // Bullets
  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -20);

  // Invaders movement (classic side-to-side + drop)
  let edge = false;
  invaders.forEach(i => { i.x += dir * speed; if(i.x < 10 || i.x + i.w > canvas.width - 10) edge = true; });

  dropTimer += dt;
  if(edge){
    dir *= -1;
    invaders.forEach(i => i.y += 12 + level*2);
  }

  // Collisions bullet->invader
  bullets.forEach(b=>{
    for(let k=invaders.length-1;k>=0;k--){
      const i = invaders[k];
      if(b.x < i.x + i.w && b.x + b.w > i.x && b.y < i.y + i.h && b.y + b.h > i.y){
        invaders.splice(k,1);
        b.y = -99; // remove bullet
        break;
      }
    }
  });

  // Lose condition if invaders reach ship line (keep it simple: just end the level)
  for(const i of invaders){
    if(i.y + i.h >= ship.y){
      // restart level
      initLevel();
      break;
    }
  }

  // Win: next level or finish all
  if(invaders.length === 0){
    level++;
    if(level < LEVEL_NAMES.length){
      initLevel();
    }else{
      // Finished 9 levels
      statusEl.innerHTML =
        "Game is over, you have completed the nine levels. <br/>" +
        "Congratulations on spending time on these two beautifully coded games. <br/>" +
        "Now please check the personality part and leave. If you want, or stay in this website for as long as you can. <br/>" +
        "Because at the end, you get to visit my product website, my brand website. So basically you can purchase stuff there.";
      // Freeze gameplay by stopping loop via a flag
      running = false;
    }
  }
}

function draw(){
  // background
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Ship
  ctx.fillStyle = "#0ff";
  ctx.fillRect(ship.x, ship.y, ship.w, ship.h);

  // Bullets
  ctx.fillStyle = "#f33";
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Invaders (retro blocks)
  ctx.fillStyle = "#7fff00";
  invaders.forEach(i => ctx.fillRect(i.x, i.y, i.w, i.h));
}

let last=0, running=true;
function loop(t=0){
  if(!running) return;
  const dt = Math.min(32, t - last); last = t;
  update(dt/16.67); // normalize a bit
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
