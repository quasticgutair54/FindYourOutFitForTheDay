<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay">
        <div class="welcome-popup">
            <h1>Hi hey hello!</h1>
            <p>Since you are here, start exploring!</p>
            <button id="start-button">Start</button>
        </div>
    </div>
    <div class="games-section">
        <h2>🎮 Playable Games</h2>
        <div class="memory-game">
            <h3>Memory Game</h3>
            <div class="card-container">
                <!-- Cards will be generated here -->
            </div>
        </div>
        <div class="space-invaders">
            <h3>Space Invaders</h3>
            <button id="start-space-invaders">Start Space Invaders</button>
        </div>
    </div>
    <div class="personality-paths">
        <h2>🧠 Personality Paths</h2>
        <ul>
            <li><a href="allout-q1.html">All Out</a></li>
            <li><a href="somewhatout-q1.html">Somewhat Out</a></li>
            <li><a href="maybe-q1.html">Maybe</a></li>
            <li><a href="never-q1.html">Never</a></li>
            <li><a href="twosides-q1.html">Two Sides of the Same Coin</a></li>
        </ul>
    </div>
    <video autoplay loop muted class="background-video">
        <source src="loop-bg.mp4" type="video/mp4">
    </video>
    <audio autoplay loop class="background-music">
        <source src="running out of time.mp3" type="audio/mpeg">
    </audio>
    <script src="script.js"></script>
</body>
</html>
