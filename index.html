<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game + Personality Paths</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Background video */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    /* Split screen */
    .container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .left, .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .left {
      border-right: 2px solid rgba(255,255,255,0.2);
    }

    /* Memory game grid */
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 15px;
    }

    .card {
      width: 100px;
      height: 140px;
      background: #222;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      perspective: 1000px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .card.flip .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }

    .card-front {
      background: #444;
      font-size: 40px;
      font-weight: bold;
    }

    .card-back {
      background: #ff6f61;
      transform: rotateY(180deg);
      padding: 10px;
      text-align: center;
    }

    /* Personality paths */
    .paths {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .path {
      background: rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .path:hover {
      background: rgba(255,255,255,0.4);
    }

    #end-message {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Background video -->
  <video id="bg-video" autoplay muted loop>
    <source src="your-video.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- Background music -->
  <audio id="bg-music" loop>
    <source src="your-music.mp3" type="audio/mp3">
  </audio>

  <div class="container">
    <!-- LEFT SIDE (Memory Game) -->
    <div class="left">
      <h2>Memory Game</h2>
      <div class="game-board" id="game-board"></div>
      <div id="end-message"></div>
    </div>

    <!-- RIGHT SIDE (Personality Paths) -->
    <div class="right">
      <h2>Choose Your Path</h2>
      <div class="paths">
        <div class="path" onclick="alert('Path 1 Questions Coming Soon')">🔥 All Out</div>
        <div class="path" onclick="alert('Path 2 Questions Coming Soon')">😎 Somewhat Out</div>
        <div class="path" onclick="alert('Path 3 Questions Coming Soon')">🤔 Maybe</div>
        <div class="path" onclick="alert('Path 4 Questions Coming Soon')">🙅 Never</div>
        <div class="path" onclick="alert('Path 5 Questions Coming Soon')">⚖️ Two Sides</div>
      </div>
    </div>
  </div>

  <script>
    /* Background Music */
    let hasInteracted = false;
    function setupAudio() {
      const audio = document.getElementById('bg-music');
      if (!audio) return;
      const savedTime = localStorage.getItem('music-time');
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      audio.play().catch(()=>{});
      setInterval(() => {
        if (!audio.paused) {
          localStorage.setItem('music-time', audio.currentTime);
        }
      }, 500);
      window.addEventListener('beforeunload', () => {
        localStorage.setItem('music-time', audio.currentTime);
      });
    }
    window.addEventListener('click', () => {
      if (!hasInteracted) {
        hasInteracted = true;
        setupAudio();
      }
    });

    /* Memory Game */
    const designs = [
      "Lorem Ipsum", "Your Toast", "Cake Was A Lie", "Grapefruit x Lime",
      "Burning Desire", "Initial D", "Not the Og", "Berserk", "Almost but Nope"
    ];
    let cards = [...designs, ...designs];
    cards.sort(() => 0.5 - Math.random());

    const board = document.getElementById('game-board');
    let flipped = [];
    let matched = 0;

    cards.forEach(name => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">N</div>
          <div class="card-back">${name}</div>
        </div>`;
      card.addEventListener('click', () => flipCard(card, name));
      board.appendChild(card);
    });

    function flipCard(card, name) {
      if (card.classList.contains('flip') || flipped.length === 2) return;
      card.classList.add('flip');
      flipped.push({card, name});

      if (flipped.length === 2) {
        if (flipped[0].name === flipped[1].name) {
          setTimeout(() => {
            flipped[0].card.style.visibility = "hidden";
            flipped[1].card.style.visibility = "hidden";
            matched++;
            if (matched === designs.length) {
              document.getElementById("end-message").style.display = "block";
              document.getElementById("end-message").innerText = "You have uncovered most of the designs. Congratulations on playing this beautiful game!";
            }
            flipped = [];
          }, 800);
        } else {
          setTimeout(() => {
            flipped[0].card.classList.remove('flip');
            flipped[1].card.classList.remove('flip');
            flipped = [];
          }, 1000);
        }
      }
    }
  </script>
</body>
</html>
