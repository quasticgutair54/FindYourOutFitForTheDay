<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NotTheBestPlaceToBuyStuff Arcade</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }
    video.bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }
    #game-container {
      display: flex;
      height: 100%;
      width: 100%;
    }
    #left-panel {
      flex: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #right-panel {
      flex: 1;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      overflow-y: auto;
    }
    canvas, #memory-game {
      background: rgba(0,0,0,0.7);
      border: 2px solid #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    #memory-game {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 10px;
      justify-content: center;
    }
    .card {
      width: 80px;
      height: 100px;
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 20px;
      border-radius: 8px;
    }
    #message-box {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 20px;
      border-radius: 10px;
      display: none;
      font-size: 20px;
      text-align: center;
    }
    button {
      margin-top: 10px;
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video autoplay loop muted class="bg-video">
    <source src="your-looping-background.mp4" type="video/mp4">
  </video>

  <!-- Background Music -->
  <audio id="bg-music" autoplay loop>
    <source src="your-background-music.mp3" type="audio/mpeg">
  </audio>

  <div id="game-container">
    <div id="left-panel">
      <div id="memory-game"></div>
      <canvas id="space-invaders" width="600" height="400" style="display:none;"></canvas>
    </div>
    <div id="right-panel">
      <h2>✨ Personality Path</h2>
      <p>Discover your Outfit of the Day through our short test!</p>
      <button onclick="visitPersonalityPath()">Go to Personality Path</button>
    </div>
  </div>

  <!-- Message box -->
  <div id="message-box"></div>

<script>
/******************* MEMORY GAME *******************/
const memoryGame = document.getElementById("memory-game");
const symbols = ["👕","👚","👔","👖","🧥","👗","👟","🧢"];
let deck = [...symbols, ...symbols];
let flipped = [];
let matched = 0;

function shuffle(array) {
  return array.sort(() => 0.5 - Math.random());
}

function startMemoryGame() {
  memoryGame.innerHTML = "";
  deck = shuffle(deck);
  deck.forEach(symbol => {
    const card = document.createElement("div");
    card.classList.add("card");
    card.dataset.symbol = symbol;
    card.innerText = "?";
    card.onclick = () => flipCard(card);
    memoryGame.appendChild(card);
  });
}

function flipCard(card) {
  if (flipped.length < 2 && card.innerText === "?") {
    card.innerText = card.dataset.symbol;
    flipped.push(card);
    if (flipped.length === 2) {
      setTimeout(checkMatch, 800);
    }
  }
}

function checkMatch() {
  if (flipped[0].dataset.symbol === flipped[1].dataset.symbol) {
    matched += 2;
    if (matched === deck.length) {
      showMessage("Not yet over...", () => startSpaceInvaders());
    }
  } else {
    flipped.forEach(c => c.innerText = "?");
  }
  flipped = [];
}

/******************* SPACE INVADERS *******************/
const canvas = document.getElementById("space-invaders");
const ctx = canvas.getContext("2d");

let player, bullets, enemies, level, gameRunning;
const levelNames = [
  "Unisex Hoodie","Crop Hoodie","Crop Tee","Unisex Tee",
  "Women’s Tee","Oversized Tee","Sweatshirt","Custom Edition","RANDOMODIUM"
];

function startSpaceInvaders(){
  memoryGame.style.display = "none";
  canvas.style.display = "block";
  level = 0;
  gameRunning = true;
  startLevel();
}

function startLevel(){
  player = {x: 280, y: 360, w: 40, h: 20};
  bullets = [];
  enemies = [];
  for (let i=0;i<5+level;i++){
    for (let j=0;j<3;j++){
      enemies.push({x: 60+i*60, y: 40+j*40, w:30,h:20,alive:true});
    }
  }
  draw();
}

function draw(){
  if (!gameRunning) return;
  ctx.clearRect(0,0,600,400);
  ctx.fillStyle = "lime";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = "red";
  bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  ctx.fillStyle = "yellow";
  enemies.forEach(e=>{if(e.alive) ctx.fillRect(e.x,e.y,e.w,e.h)});

  // Move bullets
  bullets.forEach(b=> b.y -= 5);

  // Bullet collision
  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(e.alive && b.x < e.x+e.w && b.x+b.w>e.x && b.y<e.y+e.h && b.y+b.h>e.y){
        e.alive=false;
        b.y=-100;
      }
    });
  });

  // Win condition
  if (enemies.every(e=>!e.alive)){
    level++;
    if(level<levelNames.length){
      showMessage(`Level cleared! Next: ${levelNames[level]}`, ()=>startLevel());
    } else {
      gameRunning = false;
      showMessage("Thank you for playing these beautifully coded games in this beautifully coded website. One suggestion: stay here, visit the Personality Path, find out your outfit of the day… or leave it all behind. Your choice.");
    }
    return;
  }

  requestAnimationFrame(draw);
}

document.addEventListener("keydown", e=>{
  if(!gameRunning) return;
  if(e.key==="ArrowLeft") player.x -= 20;
  if(e.key==="ArrowRight") player.x += 20;
  if(e.key===" ") bullets.push({x:player.x+18,y:player.y,w:4,h:10});
});

/******************* UI HELPERS *******************/
function showMessage(msg, cb){
  const box = document.getElementById("message-box");
  box.innerHTML = `<p>${msg}</p>`;
  box.style.display = "block";
  setTimeout(()=>{
    box.style.display = "none";
    if(cb) cb();
  }, 5000);
}

function visitPersonalityPath(){
  alert("Redirecting to Personality Path...");
  // Add your actual link
  window.location.href = "https://NotTheBestPlaceToBuyStuff.in/personality-path";
}

/******************* START *******************/
startMemoryGame();
</script>
</body>
</html>
