<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personality Test</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Background video */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Overlay layout */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
      width: 100%;
      background: rgba(0,0,0,0.4); /* dark overlay for clarity */
    }

    /* Left side: Tetris */
    .tetris-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 10px;
    }

    canvas {
      background: #111;
      border: 2px solid #fff;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }

    .controls button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ffeb3b;
    }

    /* Right side: Personality paths */
    .paths {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .path {
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .path img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid white;
    }

    .path p {
      margin-top: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .path:hover {
      transform: scale(1.05);
    }

    /* Mobile */
    @media(max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Background video -->
  <video autoplay muted loop id="bg-video">
    <source src="loop-background.mp4" type="video/mp4">
  </video>

  <!-- Background music -->
  <audio id="bg-music" autoplay loop>
    <source src="running out of time.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <!-- Left side: Tetris -->
    <div class="tetris-container">
      <h2>Tetris</h2>
      <canvas id="tetris" width="200" height="400"></canvas>
      <p id="score">Score: 0</p>
      <div class="controls">
        <button onclick="move(-1)">◀️</button>
        <button onclick="rotate()">🔄</button>
        <button onclick="move(1)">▶️</button>
        <button onclick="drop()">⬇️</button>
      </div>
    </div>

    <!-- Right side: Personality paths -->
    <div class="paths">
      <div class="path" onclick="goTo('allout-q1.html')">
        <img src="allout.png" alt="All Out">
        <p>All Out</p>
      </div>
      <div class="path" onclick="goTo('somewhat-q1.html')">
        <img src="somewhat.png" alt="Somewhat Out">
        <p>Somewhat Out</p>
      </div>
      <div class="path" onclick="goTo('never-q1.html')">
        <img src="never.png" alt="Never">
        <p>Never</p>
      </div>
      <div class="path" onclick="goTo('maybe-q1.html')">
        <img src="maybe.png" alt="Maybe">
        <p>Maybe</p>
      </div>
      <div class="path" onclick="goTo('twosides-q1.html')">
        <img src="twosides.png" alt="Two Sides of the Same Coin">
        <p>Two Sides</p>
      </div>
    </div>
  </div>

  <script>
    // Prevent user from leaving without choosing a path
    window.onbeforeunload = function() {
      return "You must pick a personality path before leaving!";
    };

    function goTo(page) {
      window.location.href = page;
    }

    // Tetris game logic
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] &&
              arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 0, 0],
          [1, 1, 1],
          [0, 1, 0],
        ];
      } else if (type === 'O') {
        return [
          [2, 2],
          [2, 2],
        ];
      } else if (type === 'L') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3],
        ];
      } else if (type === 'J') {
        return [
          [0, 4, 0],
          [0, 4, 0],
          [4, 4, 0],
        ];
      } else if (type === 'I') {
        return [
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'Z') {
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x,
                            y + offset.y,
                            1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x:0,y:0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) -
                     (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function playerRotate() {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, true);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, reverse) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
            matrix[y][x],
            matrix[x][y],
          ];
        }
      }
      if (reverse) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;

    let lastTime = 0;
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = "Score: " + player.score;
    }

    const colors = [
      null,
      '#FF0D72',
      '#0DC2FF',
      '#0DFF72',
      '#F538FF',
      '#FF8E0D',
      '#FFE138',
      '#3877FF',
    ];

    const arena = createMatrix(10, 20);

    const player = {
      pos: {x:0,y:0},
      matrix: null,
      score: 0
    };

    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 81) {
        playerRotate(true);
      } else if (event.keyCode === 87) {
        playerRotate(false);
      }
    });

    function move(dir) { playerMove(dir); }
    function rotate() { playerRotate(); }
    function drop() { playerDrop(); }

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
