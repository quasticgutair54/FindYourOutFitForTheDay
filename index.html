<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotTheBest Personality Quiz</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Comic Sans MS, cursive, sans-serif;
      overflow: hidden;
      color: white;
    }
    
    /* Background video */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }

    .container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .tetris-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
    }

    .tetris-section h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      text-align: center;
      padding: 0 10px;
    }

    #score {
      font-size: 1.2rem;
      margin: 8px 0;
      font-weight: bold;
    }

    canvas {
      background: #111;
      border: 2px solid #fff;
    }

    .controls button {
      margin: 5px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #444;
      color: white;
      font-size: 1rem;
    }

    .paths-section {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      grid-gap: 20px;
      align-items: center;
      justify-items: center;
      overflow-y: auto;
      padding: 20px;
      background: rgba(0,0,0,0.4);
    }

    .personality {
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .personality:hover {
      transform: scale(1.05);
    }

    .personality img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 20px;
      border: 3px solid #fff;
      display: block;
      margin-bottom: 8px;
    }

    .personality span {
      font-family: 'Tan Nimbus', serif;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .paths-section {
        grid-template-columns: repeat(2, 1fr);
      }
      .personality img {
        width: 140px;
        height: 140px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop id="bg-video">
    <source src="background.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <div class="container">
    <!-- Tetris Section -->
    <div class="tetris-section">
      <h1>If you want to play this game or else go click the personalities at the side and choose your outfit.</h1>
      <div id="score">Score: 0</div>
      <canvas id="tetris" width="240" height="400"></canvas>
      <div class="controls">
        <button onclick="playerMove(-1)">◀️</button>
        <button onclick="playerMove(1)">▶️</button>
        <button onclick="playerDrop()">⬇️</button>
        <button onclick="playerRotate(1)">🔄</button>
      </div>
    </div>

    <!-- Personality Paths Section -->
    <div class="paths-section">
      <div class="personality" onclick="location.href='allout-q1.html'">
        <img src="allout.png" alt="All Out">
        <span>All Out</span>
      </div>
      <div class="personality" onclick="location.href='somewhat-q1.html'">
        <img src="somewhat.png" alt="Somewhat Out">
        <span>Somewhat Out</span>
      </div>
      <div class="personality" onclick="location.href='never-q1.html'">
        <img src="never.png" alt="Never">
        <span>Never</span>
      </div>
      <div class="personality" onclick="location.href='maybe-q1.html'">
        <img src="maybe.png" alt="Maybe">
        <span>Maybe</span>
      </div>
      <div class="personality" onclick="location.href='twosides-q1.html'">
        <img src="twosides.png" alt="Two Sides">
        <span>Two Sides of the Same Coin</span>
      </div>
    </div>
  </div>

  <!-- Background Music -->
  <audio id="bg-music" autoplay loop>
    <source src="running out of time.mp3" type="audio/mpeg">
  </audio>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length -1; y >=0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
              (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0,0,0],
          [1,1,1],
          [0,1,0],
        ];
      } else if (type === 'O') {
        return [
          [2,2],
          [2,2],
        ];
      } else if (type === 'L') {
        return [
          [0,3,0],
          [0,3,0],
          [0,3,3],
        ];
      } else if (type === 'J') {
        return [
          [0,4,0],
          [0,4,0],
          [4,4,0],
        ];
      } else if (type === 'I') {
        return [
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
        ];
      } else if (type === 'S') {
        return [
          [0,6,6],
          [6,6,0],
          [0,0,0],
        ];
      } else if (type === 'Z') {
        return [
          [7,7,0],
          [0,7,7],
          [0,0,0],
        ];
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x,
                             y + offset.y,
                             1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x:0, y:0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
            matrix[y][x],
            matrix[x][y],
          ];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;

    let lastTime = 0;
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = 'Score: ' + player.score;
    }

    const colors = [
      null,
      '#FF0D72',
      '#0DC2FF',
      '#0DFF72',
      '#F538FF',
      '#FF8E0D',
      '#FFE138',
      '#3877FF',
    ];

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
    };

    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
