<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game + Personality Paths</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Background video */
    video.bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* Left side games */
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    canvas {
      background: rgba(0,0,0,0.6);
      border: 2px solid white;
      border-radius: 10px;
    }

    .game-message {
      margin-top: 15px;
      font-size: 1rem;
      text-align: center;
    }

    /* Right side personality paths */
    .right {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      padding: 15px;
      align-items: center;
      justify-items: center;
    }

    .personality {
      width: 100%;
      max-width: 200px;
      text-align: center;
    }

    .personality img {
      width: 100%;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .personality img:hover {
      transform: scale(1.05);
    }

    .personality p {
      margin-top: 5px;
      font-weight: bold;
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .right {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(3, auto);
        overflow-y: auto;
      }
      .left {
        order: 2;
      }
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop class="bg-video">
    <source src="loop-bg.mp4" type="video/mp4">
  </video>

  <!-- Background Music -->
  <audio autoplay loop>
    <source src="running-out-of-time.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <!-- LEFT SIDE GAMES -->
    <div class="left">
      <canvas id="gameCanvas" width="350" height="350"></canvas>
      <div class="game-message" id="gameMessage">Match the cards to start!</div>
    </div>

    <!-- RIGHT SIDE PERSONALITY PATHS -->
    <div class="right">
      <div class="personality">
        <a href="all-out.html"><img src="path1.jpg" alt="All Out"></a>
        <p>All Out</p>
      </div>
      <div class="personality">
        <a href="somewhat-out.html"><img src="path2.jpg" alt="Somewhat Out"></a>
        <p>Somewhat Out</p>
      </div>
      <div class="personality">
        <a href="maybe.html"><img src="path3.jpg" alt="Maybe"></a>
        <p>Maybe</p>
      </div>
      <div class="personality">
        <a href="never.html"><img src="path4.jpg" alt="Never"></a>
        <p>Never</p>
      </div>
      <div class="personality">
        <a href="two-sides.html"><img src="path5.jpg" alt="Two Sides of Same Coin"></a>
        <p>Two Sides of Same Coin</p>
      </div>
    </div>
  </div>

  <script>
    // ===== MEMORY MATCH GAME =====
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("gameMessage");

    const rows = 4, cols = 4, cardSize = 80;
    let cards = [], flippedCards = [], matchedPairs = 0;

    function createCards() {
      let values = [];
      for (let i = 1; i <= (rows * cols) / 2; i++) {
        values.push(i, i);
      }
      values = values.sort(() => 0.5 - Math.random());
      cards = values.map((v, i) => ({
        value: v, x: (i % cols) * cardSize, y: Math.floor(i / cols) * cardSize,
        flipped: false, matched: false
      }));
    }

    function drawCards() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      cards.forEach(card => {
        ctx.fillStyle = card.flipped || card.matched ? "white" : "gray";
        ctx.fillRect(card.x+5, card.y+5, cardSize-10, cardSize-10);
        if (card.flipped || card.matched) {
          ctx.fillStyle = "black";
          ctx.fillText(card.value, card.x + cardSize/2, card.y + cardSize/2);
        }
      });
    }

    function handleClick(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      let clicked = cards.find(c =>
        !c.flipped && !c.matched &&
        x > c.x && x < c.x + cardSize &&
        y > c.y && y < c.y + cardSize
      );
      if (clicked) {
        clicked.flipped = true;
        flippedCards.push(clicked);
        if (flippedCards.length === 2) {
          if (flippedCards[0].value === flippedCards[1].value) {
            flippedCards.forEach(c => c.matched = true);
            matchedPairs++;
            if (matchedPairs === (rows*cols)/2) {
              message.textContent = "Uh-uh, not so fast. Sure, this game is over, but you can play another game!";
              setTimeout(startSpaceInvaders, 2500);
            }
          } else {
            setTimeout(() => {
              flippedCards.forEach(c => c.flipped = false);
              flippedCards = [];
              drawCards();
            }, 800);
          }
          flippedCards = [];
        }
      }
      drawCards();
    }

    // ===== SPACE INVADERS =====
    let invaderInterval, ship, bullets, invaders, level = 0;
    const levels = ["All Out","Somewhat Out","Maybe","Never","Two Sides of Same Coin","Extra 4","Extra 5","Extra 6","Extra 7"];

    function startSpaceInvaders() {
      canvas.removeEventListener("click", handleClick);
      ship = { x: canvas.width/2 - 20, y: canvas.height-30, w: 40, h: 20 };
      bullets = [];
      invaders = [];
      level = 0;
      spawnInvaders();
      invaderInterval = setInterval(updateInvaders, 30);
      document.addEventListener("keydown", moveShip);
      message.textContent = "Level 1: " + levels[level];
    }

    function spawnInvaders() {
      invaders = [];
      for (let i=0;i<5;i++){
        for (let j=0;j<3;j++){
          invaders.push({x: i*60+30, y: j*40+30, w: 30, h: 20});
        }
      }
    }

    function drawInvaders() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="lime";
      ctx.fillRect(ship.x, ship.y, ship.w, ship.h);
      ctx.fillStyle="yellow";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 10));
      ctx.fillStyle="red";
      invaders.forEach(inv => ctx.fillRect(inv.x, inv.y, inv.w, inv.h));
    }

    function updateInvaders() {
      bullets.forEach(b => b.y -= 5);
      bullets = bullets.filter(b => b.y>0);
      bullets.forEach(b=>{
        invaders.forEach((inv,i)=>{
          if(b.x>inv.x && b.x<inv.x+inv.w && b.y<inv.y+inv.h){
            invaders.splice(i,1);
            b.y=-10;
          }
        })
      });
      drawInvaders();
      if (invaders.length===0){
        level++;
        if(level<levels.length){
          spawnInvaders();
          message.textContent="Level "+(level+1)+": "+levels[level];
        } else {
          clearInterval(invaderInterval);
          message.textContent="Game is over, you have completed the nine levels. Congratulations on spending time on these two beautifully coded games. Now please check the personality part and leave—or stay as long as you want. Eventually, you get to visit my product website.";
        }
      }
    }

    function moveShip(e){
      if(e.key==="ArrowLeft") ship.x -= 20;
      if(e.key==="ArrowRight") ship.x += 20;
      if(e.key===" "){
        bullets.push({x: ship.x+ship.w/2, y: ship.y});
      }
    }

    // Init memory game
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font="20px Arial";
    createCards(); drawCards();
    canvas.addEventListener("click", handleClick);
  </script>
</body>
</html>
