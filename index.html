<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Your Outfit of the Day</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden; font-family: Arial, sans-serif; color: white;
    }
    video.bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }
    .container {
      display: flex; height: 100%; width: 100%;
    }
    .left, .right {
      flex: 1; padding: 20px; overflow-y: auto;
    }
    .left { background: rgba(0,0,0,0.4); }
    .right { background: rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    /* Personality paths */
    .paths button {
      margin: 10px; padding: 15px 25px; border: none; border-radius: 10px;
      font-size: 18px; cursor: pointer; background: #ff4081; color: white;
      transition: 0.3s;
    }
    .paths button:hover { background: #e91e63; }

    /* Memory Game */
    #memory-game {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; max-width: 500px; margin: 20px auto;
    }
    .card {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      border-radius: 12px; height: 100px; display: flex; justify-content: center; align-items: center;
      font-size: 16px; font-weight: bold; color: black; cursor: pointer; position: relative;
    }
    .card.flipped {
      background: #fff3; color: white;
    }
    .hidden { display: none; }
    
    /* Message after game */
    #transition-message {
      font-size: 22px; text-align: center; margin: 30px;
    }
    
    /* Space Invaders placeholder */
    #space-invaders {
      width: 100%; height: 500px; background: black; color: lime; display: none;
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop class="bg">
    <source src="bg.mp4" type="video/mp4">
  </video>

  <!-- Background Music -->
  <audio id="bg-music" autoplay loop>
    <source src="running-out-of-time.mp3" type="audio/mp3">
  </audio>

  <div class="container">
    <!-- Left side games -->
    <div class="left">
      <h2>Games</h2>
      <div id="memory-game"></div>
      <div id="transition-message" class="hidden">Not yet over...</div>
      <canvas id="space-invaders"></canvas>
    </div>
    
    <!-- Right side personality path -->
    <div class="right">
      <h2>Choose Your Path</h2>
      <div class="paths">
        <button onclick="window.location='allout-q1.html'">All Out</button>
        <button onclick="window.location='never-q1.html'">Never</button>
        <button onclick="window.location='maybe-q1.html'">Maybe</button>
        <button onclick="window.location='somewhatout-q1.html'">Somewhat Out</button>
        <button onclick="window.location='twosides-q1.html'">Two Sides of the Same Coin</button>
      </div>
    </div>
  </div>

  <script>
    // Memory Game Setup
    const products = ["Hoodie","Crop Tee","Oversized Tee","Sweatshirt","Unisex Tee","Women's Tee","Custom Hoodie","Custom Tee"];
    let gameBoard = document.getElementById("memory-game");
    let cards = [...products, ...products];
    let flipped = [];
    
    // Shuffle
    cards.sort(() => 0.5 - Math.random());
    cards.forEach(p => {
      let card = document.createElement("div");
      card.className = "card";
      card.dataset.value = p;
      card.innerHTML = "N";
      card.onclick = () => flip(card);
      gameBoard.appendChild(card);
    });
    
    function flip(card) {
      if (flipped.length < 2 && !card.classList.contains("flipped")) {
        card.innerHTML = card.dataset.value;
        card.classList.add("flipped");
        flipped.push(card);
      }
      if (flipped.length === 2) {
        if (flipped[0].dataset.value === flipped[1].dataset.value) {
          flipped = [];
        } else {
          setTimeout(() => {
            flipped.forEach(c => { c.classList.remove("flipped"); c.innerHTML="N"; });
            flipped = [];
          }, 1000);
        }
      }
      // Check win
      if ([...document.querySelectorAll(".card")].every(c => c.classList.contains("flipped"))) {
        setTimeout(() => {
          document.getElementById("memory-game").style.display = "none";
          document.getElementById("transition-message").classList.remove("hidden");
          setTimeout(() => {
            document.getElementById("transition-message").style.display="none";
            document.getElementById("space-invaders").style.display="block";
            startSpaceInvaders();
          }, 5000);
        }, 1000);
      }
    }
    
    // Space Invaders basic starter
    function startSpaceInvaders() {
      let canvas = document.getElementById("space-invaders");
      let ctx = canvas.getContext("2d");
      ctx.fillStyle = "lime";
      ctx.font = "24px monospace";
      ctx.fillText("Space Invaders - Level 1: Lorem Ipsum", 50, 100);
    }
  </script>
</body>
</html>
