<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiFlow Home</title>

  <style>
    /* === Base Styles === */
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Tan Nimbus', sans-serif;
      height: 100%;
      width: 100%;
      color: black;
      background: #fafafa;
      overflow-x: hidden;
    }

    /* === Overlay Personality Section === */
    .overlay {
      background-color: rgba(255, 255, 255, 0.85);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .main-heading {
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .personality-options {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
    }

    .personality-options img {
      width: 200px;
      border-radius: 10px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .personality-options img:hover {
      transform: scale(1.05);
    }

    /* === Games Section === */
    #games {
      display: flex;
      justify-content: space-around;
      padding: 2rem;
      flex-wrap: wrap;
    }

    .game-container {
      flex: 1 1 45%;
      background: white;
      padding: 1rem;
      margin: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    canvas {
      background: #111;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }

    /* Prevent leaving until personality chosen */
    .block-leave {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      color: white;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      z-index: 9999;
    }
  </style>
</head>
<body>
  
  <!-- Background Music -->
  <audio id="bg-music" loop>
    <source src="your-music.mp3" type="audio/mpeg">
  </audio>

  <!-- Overlay for Personality -->
  <div class="overlay" id="overlay">
    <h1 class="main-heading">Choose Your Personality Path</h1>
    <div class="personality-options">
      <img src="path1.jpg" alt="Path 1" onclick="selectPersonality('path1.html')">
      <img src="path2.jpg" alt="Path 2" onclick="selectPersonality('path2.html')">
      <img src="path3.jpg" alt="Path 3" onclick="selectPersonality('path3.html')">
    </div>
  </div>

  <!-- Games Section -->
  <section id="games">
    <!-- Memory Game -->
    <div class="game-container">
      <h2>Memory Game</h2>
      <canvas id="memoryGame" width="300" height="300"></canvas>
    </div>

    <!-- Space Invaders -->
    <div class="game-container">
      <h2>Space Invaders</h2>
      <canvas id="spaceInvaders" width="400" height="400"></canvas>
    </div>
  </section>

  <!-- Leave Blocker -->
  <div class="block-leave" id="blockLeave">🚫 You cannot leave until you choose your personality path!</div>

  <script>
    /* === Music Persistence === */
    let hasInteracted = false;
    function setupAudio() {
      const audio = document.getElementById('bg-music');
      if (!audio) return;
      const savedTime = localStorage.getItem('music-time');
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      audio.play().catch(() => {});
      setInterval(() => {
        if (!audio.paused) {
          localStorage.setItem('music-time', audio.currentTime);
        }
      }, 500);
      window.addEventListener('beforeunload', () => {
        localStorage.setItem('music-time', audio.currentTime);
      });
    }
    window.addEventListener('click', () => {
      if (!hasInteracted) {
        hasInteracted = true;
        setupAudio();
      }
    });

    /* === Prevent Leaving === */
    let personalityChosen = false;
    function selectPersonality(link) {
      personalityChosen = true;
      window.location.href = link; // redirect to question page
    }
    window.addEventListener('beforeunload', (e) => {
      if (!personalityChosen) {
        e.preventDefault();
        document.getElementById('blockLeave').style.display = "flex";
        return (e.returnValue = "You must choose a path before leaving!");
      }
    });

    /* === Memory Game (Simple Version) === */
    const memCanvas = document.getElementById("memoryGame");
    const memCtx = memCanvas.getContext("2d");
    memCtx.fillStyle = "white";
    memCtx.font = "20px Arial";
    memCtx.fillText("🃏 Memory Game Placeholder", 20, 150);

    /* === Space Invaders (Simple Version) === */
    const siCanvas = document.getElementById("spaceInvaders");
    const siCtx = siCanvas.getContext("2d");
    siCtx.fillStyle = "lime";
    siCtx.font = "20px Arial";
    siCtx.fillText("👾 Space Invaders Placeholder", 40, 200);
  </script>
</body>
</html>
