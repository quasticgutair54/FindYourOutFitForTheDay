<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiFlow Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Intro -->
  <div id="intro" class="screen">
    <h1>Not Over Yet</h1>
  </div>

  <!-- Memory Game -->
  <div id="memoryGame" class="screen hidden">
    <h2>Memory Match</h2>
    <div id="memoryGrid" class="grid"></div>
    <button id="restartMemory">Restart</button>
  </div>

  <!-- Space Invaders -->
  <div id="spaceInvaders" class="screen hidden">
    <h2>Space Invaders</h2>
    <canvas id="spaceCanvas" width="800" height="600"></canvas>
  </div>

  <!-- Personality Path -->
  <div id="personalityPath" class="screen hidden">
    <h2>Choose Your Path</h2>
    <div class="path-options">
      <a href="question-1.html" class="path-btn">All Out</a>
      <a href="question-2.html" class="path-btn">Somewhat Out</a>
      <a href="question-3.html" class="path-btn">Maybe</a>
      <a href="question-4.html" class="path-btn">Never</a>
      <a href="question-5.html" class="path-btn">Two Sides</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
