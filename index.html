<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotTheBest Personality Quiz</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Sans+MS&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tan+Nimbus&display=swap">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: white;
      overflow-x: hidden;
      text-align: center;
    }

    /* Background image */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('Untitled design (2).png') no-repeat center center/cover;
      z-index: -1;
      filter: brightness(0.7);
    }

    h1 {
      font-family: 'Tan Nimbus', serif;
      margin: 20px 0;
      font-size: 2.5rem;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    /* Popup */
    #popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      z-index: 1000;
    }

    #popup button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: yellow;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 8px;
    }

    /* Personalities grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .personality {
      cursor: pointer;
      transition: transform 0.2s;
    }

    .personality img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .personality p {
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .personality:hover {
      transform: scale(1.05);
    }

    /* Tetris section */
    #tetris-container {
      margin: 40px auto;
      text-align: center;
    }

    canvas {
      background: #000;
      display: block;
      margin: auto;
      border: 2px solid white;
    }

    #score {
      font-size: 1.5rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="popup">
    <div>
      <p>Since you scanned it, might as well check your personal outfit.</p>
      <button onclick="closePopup()">Start</button>
    </div>
  </div>

  <h1>NotTheBest Personality Quiz</h1>

  <!-- Personalities -->
  <div class="grid">
    <div class="personality" onclick="goTo('allout-q1.html')">
      <img src="allout.jpg" alt="All Out">
      <p>All Out</p>
    </div>
    <div class="personality" onclick="goTo('somewhat-q1.html')">
      <img src="somewhat.jpg" alt="Somewhat Out">
      <p>Somewhat Out</p>
    </div>
    <div class="personality" onclick="goTo('never-q1.html')">
      <img src="never.jpg" alt="Never">
      <p>Never</p>
    </div>
    <div class="personality" onclick="goTo('maybe-q1.html')">
      <img src="maybe.jpg" alt="Maybe">
      <p>Maybe</p>
    </div>
    <div class="personality" onclick="goTo('twosides-q1.html')">
      <img src="twosides.jpg" alt="Two Sides of the Same Coin">
      <p>Two Sides</p>
    </div>
  </div>

  <!-- Tetris Game -->
  <div id="tetris-container">
    <canvas id="tetris" width="240" height="400"></canvas>
    <div id="score">Score: 0</div>
  </div>

  <!-- Background Music -->
  <audio id="bg-music" src="running out of time.mp3" loop></audio>

  <script>
    // Popup
    function closePopup() {
      document.getElementById("popup").style.display = "none";
      document.getElementById("bg-music").play();
    }

    // Navigation
    function goTo(page) {
      localStorage.setItem("musicTime", document.getElementById("bg-music").currentTime);
      window.location.href = page;
    }

    // Seamless Music
    const music = document.getElementById("bg-music");
    const savedTime = localStorage.getItem("musicTime");
    if (savedTime) music.currentTime = savedTime;
    music.volume = 0.4;

    setInterval(() => {
      localStorage.setItem("musicTime", music.currentTime);
    }, 500);

    // Tetris
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length -1; y >=0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] &&
              arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0,0,0],
          [1,1,1],
          [0,1,0],
        ];
      } else if (type === 'O') {
        return [
          [2,2],
          [2,2],
        ];
      } else if (type === 'L') {
        return [
          [0,3,0],
          [0,3,0],
          [0,3,3],
        ];
      } else if (type === 'J') {
        return [
          [0,4,0],
          [0,4,0],
          [4,4,0],
        ];
      } else if (type === 'I') {
        return [
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
        ];
      } else if (type === 'S') {
        return [
          [0,6,6],
          [6,6,0],
          [0,0,0],
        ];
      } else if (type === 'Z') {
        return [
          [7,7,0],
          [0,7,7],
          [0,0,0],
        ];
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x,
                             y + offset.y,
                             1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x:0, y:0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) -
                     (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [ matrix[x][y], matrix[y][x] ] = [ matrix[y][x], matrix[x][y] ];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = 'Score: ' + player.score;
    }

    const colors = [
      null,
      '#FF0D72',
      '#0DC2FF',
      '#0DFF72',
      '#F538FF',
      '#FF8E0D',
      '#FFE138',
      '#3877FF',
    ];

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x:0, y:0},
      matrix: null,
      score: 0,
    };

    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 81) {
        playerRotate(-1);
      } else if (event.keyCode === 87) {
        playerRotate(1);
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
