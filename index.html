<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        
        h1 {
            color: #7cf3d6;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #7cf3d6;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }
        
        #gameCanvas {
            background-color: #000;
            border: 2px solid #7cf3d6;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(124, 243, 214, 0.3);
        }
        
        .game-ui {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding: 0 10px;
        }
        
        .score, .lives, .level {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .controls {
            margin-top: 20px;
            color: #7cf3d6;
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: #ff6f61;
            font-weight: bold;
            display: none;
            text-align: center;
            z-index: 10;
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0% { box-shadow: 0 0 10px #ff6f61; }
            50% { box-shadow: 0 0 20px #ff6f61; }
            100% { box-shadow: 0 0 10px #ff6f61; }
        }
        
        .btn {
            background: #ff6f61;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .in-game-message {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #7cf3d6;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0 0 10px #7cf3d6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Space Invaders</h1>
        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <div id="message" class="message">
                <h2 id="messageText">Game Over</h2>
                <button id="restartBtn" class="btn">Play Again</button>
            </div>
            <div id="inGameMessage" class="in-game-message"></div>
        </div>
        <div class="game-ui">
            <div class="score">Score: <span id="scoreValue">0</span></div>
            <div class="lives">Lives: <span id="livesValue">3</span></div>
            <div class="level">Level: <span id="levelValue">1</span></div>
        </div>
        <div class="controls">
            <p>Use ← → to move, Space to shoot</p>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreValue = document.getElementById('scoreValue');
        const livesValue = document.getElementById('livesValue');
        const levelValue = document.getElementById('levelValue');
        const message = document.getElementById('message');
        const messageText = document.getElementById('messageText');
        const restartBtn = document.getElementById('restartBtn');
        const inGameMessage = document.getElementById('inGameMessage');
        
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let player = null;
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let lastShotTime = 0;
        let lastEnemyShotTime = 0;
        let lastMessageTime = 0;
        let keys = {};
        let gameLoopId = null;
        
        // Level configurations
        const levelConfigs = [
            { // Level 1 - Notthebest OG
                enemyRows: 2,
                enemyCols: 8,
                enemySpeed: 0.8,
                enemyFireRate: 0.005,
                enemyHealth: 1,
                description: "Intro, simple enemies, chill"
            },
            { // Level 2 - Initial D
                enemyRows: 2,
                enemyCols: 8,
                enemySpeed: 1.2,
                enemyFireRate: 0.007,
                enemyHealth: 1,
                description: "Faster enemies, drift-style movement"
            },
            { // Level 3 - Lorem Ipsum
                enemyRows: 3,
                enemyCols: 8,
                enemySpeed: 1.0,
                enemyFireRate: 0.009,
                enemyHealth: 1,
                description: "Enemies with random Latin-like text"
            },
            { // Level 4 - Your Toast
                enemyRows: 3,
                enemyCols: 8,
                enemySpeed: 1.3,
                enemyFireRate: 0.012,
                enemyHealth: 1,
                description: "Shooting toaster-bread bullets"
            },
            { // Level 5 - Grapefruit x Lime
                enemyRows: 4,
                enemyCols: 8,
                enemySpeed: 1.1,
                enemyFireRate: 0.01,
                enemyHealth: 1,
                description: "Random lemons floating as blockers"
            },
            { // Level 6 - Cake Was A Lie
                enemyRows: 4,
                enemyCols: 8,
                enemySpeed: 1.5,
                enemyFireRate: 0.015,
                enemyHealth: 1,
                description: "Cupcake-shaped enemies with tricky movement"
            },
            { // Level 7 - Berserk
                enemyRows: 5,
                enemyCols: 8,
                enemySpeed: 1.8,
                enemyFireRate: 0.02,
                enemyHealth: 1,
                description: "Fast, aggressive, non-stop shooting"
            },
            { // Level 8 - RANDOMODIUM
                enemyRows: 5,
                enemyCols: 8,
                enemySpeed: 2.2,
                enemyFireRate: 0.025,
                enemyHealth: 2,
                description: "Final boss chaos level"
            }
        ];
        
        // In-game messages
        const messages = [
            "what you doing",
            "complete it bro",
            "choose persistence over consistency",
            "focus!",
            "don't give up",
            "almost there",
            "keep going",
            "you got this"
        ];
        
        // Player class
        class Player {
            constructor() {
                this.width = 50;
                this.height = 20;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - this.height - 20;
                this.speed = 8;
                this.color = '#7cf3d6';
            }
            
            draw() {
                ctx.fillStyle = this.color;
                // Draw ship body
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                
                // Draw cockpit
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw fins
                ctx.fillStyle = '#ff6f61';
                ctx.fillRect(this.x, this.y + this.height - 5, 5, 5);
                ctx.fillRect(this.x + this.width - 5, this.y + this.height - 5, 5, 5);
            }
            
            update() {
                if (keys['ArrowLeft'] && this.x > 0) {
                    this.x -= this.speed;
                }
                if (keys['ArrowRight'] && this.x + this.width < canvas.width) {
                    this.x += this.speed;
                }
            }
            
            shoot() {
                const now = Date.now();
                if (now - lastShotTime > 150) { // Rapid fire with cooldown
                    bullets.push(new Bullet(this.x + this.width / 2 - 2, this.y, 4, 10, '#7cf3d6', -7));
                    lastShotTime = now;
                }
            }
        }
        
        // Enemy class
        class Enemy {
            constructor(x, y, width, height, color, health, speed) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
                this.health = health;
                this.speed = speed;
                this.alive = true;
            }
            
            draw() {
                if (!this.alive) return;
                
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw enemy details based on health
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 5, this.y + 5, this.width - 10, 3);
                
                if (this.health > 1) {
                    ctx.fillStyle = '#ff6f61';
                    ctx.fillRect(this.x + 3, this.y + 3, 4, 4);
                    ctx.fillRect(this.x + this.width - 7, this.y + 3, 4, 4);
                }
            }
            
            update() {
                if (!this.alive) return;
                
                this.x += this.speed;
            }
            
            hit() {
                this.health--;
                if (this.health <= 0) {
                    this.alive = false;
                    score += 10 * level;
                    scoreValue.textContent = score;
                    return true;
                }
                return false;
            }
        }
        
        // Bullet class
        class Bullet {
            constructor(x, y, width, height, color, speed) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
                this.speed = speed;
                this.active = true;
            }
            
            draw() {
                if (!this.active) return;
                
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
            
            update() {
                if (!this.active) return;
                
                this.y += this.speed;
                
                // Deactivate if out of bounds
                if (this.y < 0 || this.y > canvas.height) {
                    this.active = false;
                }
            }
        }
        
        // Initialize the game
        function initGame() {
            // Reset game state
            gameActive = true;
            score = 0;
            lives = 3;
            level = 1;
            bullets = [];
            enemyBullets = [];
            
            scoreValue.textContent = score;
            livesValue.textContent = lives;
            levelValue.textContent = level;
            
            // Create player
            player = new Player();
            
            // Create enemies for current level
            createEnemies();
            
            // Hide message
            message.style.display = 'none';
            
            // Start game loop
            if (gameLoopId) {
                cancelAnimationFrame(gameLoopId);
            }
            gameLoop();
        }
        
        // Create enemies based on current level
        function createEnemies() {
            enemies = [];
            const config = levelConfigs[level - 1];
            const enemyWidth = 40;
            const enemyHeight = 30;
            const enemyPadding = 15;
            
            for (let row = 0; row < config.enemyRows; row++) {
                for (let col = 0; col < config.enemyCols; col++) {
                    const x = col * (enemyWidth + enemyPadding) + 50;
                    const y = row * (enemyHeight + enemyPadding) + 50;
                    const color = `hsl(${row * 30 + col * 5}, 80%, 60%)`;
                    
                    enemies.push(new Enemy(
                        x, y, enemyWidth, enemyHeight, color, 
                        config.enemyHealth, config.enemySpeed
                    ));
                }
            }
        }
        
        // Show in-game message
        function showMessage(text) {
            inGameMessage.textContent = text;
            inGameMessage.style.opacity = '1';
            
            setTimeout(() => {
                inGameMessage.style.opacity = '0';
            }, 3000);
        }
        
        // Game loop
        function gameLoop() {
            if (!gameActive) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw player
            player.update();
            player.draw();
            
            // Update and draw bullets
            updateBullets();
            
            // Update and draw enemies
            updateEnemies();
            
            // Update and draw enemy bullets
            updateEnemyBullets();
            
            // Enemy shooting logic
            enemyShooting();
            
            // Check for collisions
            checkCollisions();
            
            // Check for level completion
            checkLevelCompletion();
            
            // Show random messages every 5 seconds
            const now = Date.now();
            if (now - lastMessageTime > 5000) {
                showMessage(messages[Math.floor(Math.random() * messages.length)]);
                lastMessageTime = now;
            }
            
            // Continue game loop
            gameLoopId = requestAnimationFrame(gameLoop);
        }
        
        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                bullets[i].draw();
                
                // Remove inactive bullets
                if (!bullets[i].active) {
                    bullets.splice(i, 1);
                }
            }
        }
        
        // Update enemies
        function updateEnemies() {
            let directionChanged = false;
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (!enemies[i].alive) {
                    enemies.splice(i, 1);
                    continue;
                }
                
                enemies[i].update();
                enemies[i].draw();
                
                // Change direction if hitting the edge
                if ((enemies[i].x <= 0 && enemies[i].speed < 0) || 
                    (enemies[i].x + enemies[i].width >= canvas.width && enemies[i].speed > 0)) {
                    directionChanged = true;
                }
            }
            
            // Change direction for all enemies if needed
            if (directionChanged) {
                for (let enemy of enemies) {
                    enemy.speed *= -1;
                    enemy.y += 20;
                    
                    // Check if enemies reached the bottom
                    if (enemy.y + enemy.height >= player.y) {
                        loseLife();
                        break;
                    }
                }
            }
        }
        
        // Update enemy bullets
        function updateEnemyBullets() {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].update();
                enemyBullets[i].draw();
                
                // Remove inactive bullets
                if (!enemyBullets[i].active) {
                    enemyBullets.splice(i, 1);
                }
            }
        }
        
        // Enemy shooting logic
        function enemyShooting() {
            const now = Date.now();
            if (now - lastEnemyShotTime > 1000 / levelConfigs[level - 1].enemyFireRate) {
                if (enemies.length > 0) {
                    const shooter = enemies[Math.floor(Math.random() * enemies.length)];
                    enemyBullets.push(new Bullet(
                        shooter.x + shooter.width / 2 - 2, 
                        shooter.y + shooter.height, 
                        4, 10, '#ff6f61', 5
                    ));
                }
                lastEnemyShotTime = now;
            }
        }
        
        // Check for collisions
        function checkCollisions() {
            // Player bullets vs enemies
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (enemies[j].alive && checkCollision(bullets[i], enemies[j])) {
                        bullets[i].active = false;
                        if (enemies[j].hit()) {
                            // Enemy destroyed
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }
            }
            
            // Enemy bullets vs player
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                if (checkCollision(enemyBullets[i], player)) {
                    enemyBullets[i].active = false;
                    loseLife();
                    enemyBullets.splice(i, 1);
                    break;
                }
            }
        }
        
        // Check collision between two objects
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }
        
        // Check for level completion
        function checkLevelCompletion() {
            if (enemies.length === 0) {
                if (level < levelConfigs.length) {
                    level++;
                    levelValue.textContent = level;
                    createEnemies();
                    showMessage(`Level ${level}: ${levelConfigs[level - 1].description}`);
                } else {
                    // Game completed
                    gameActive = false;
                    messageText.textContent = "You Win!";
                    message.style.display = 'block';
                }
            }
        }
        
        // Lose a life
        function loseLife() {
            lives--;
            livesValue.textContent = lives;
            
            if (lives <= 0) {
                // Game over
                gameActive = false;
                messageText.textContent = "Game Over";
                message.style.display = 'block';
            } else {
                // Brief invulnerability period
                gameActive = false;
                setTimeout(() => {
                    gameActive = true;
                    gameLoop();
                }, 1000);
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ' && gameActive) {
                player.shoot();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        restartBtn.addEventListener('click', initGame);
        
        // Prevent context menu on right-click
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // Initialize the game
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
