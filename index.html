<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Home | Games + Personality Paths</title>
<style>
  :root {
    --glass: rgba(0, 0, 0, 0.45);
    --glass-strong: rgba(0, 0, 0, 0.6);
    --accent: #ff6f61;
    --accent-2: #7cf3d6;
    --cardW-desktop: 110px;
    --cardH-desktop: 140px;
    --cardW-mobile: 78px;
    --cardH-mobile: 102px;
    --gap: 12px;
  }

  * {
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  html, body {
    height: 100%; 
    width: 100%; 
    overflow: hidden; 
    font-family: Arial, Helvetica, sans-serif; 
    color: #fff; 
  }

  /* Background video */
  #bg-video {
    position: fixed; 
    inset: 0; 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    z-index: -2; 
  }
  .bg-overlay {
    position: fixed; 
    inset: 0; 
    background: linear-gradient(0deg, var(--glass-strong), rgba(0, 0, 0, 0.35)); 
    z-index: -1; 
  }

  /* Layout */
  .wrap {
    height: 100vh; 
    width: 100%; 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
  }

  .left, .right {
    position: relative; 
    padding: 20px; 
    overflow: hidden; 
  }
  .panel {
    height: 100%; 
    width: 100%; 
    background: var(--glass); 
    backdrop-filter: blur(6px); 
    border: 1px solid rgba(255, 255, 255, 0.12); 
    border-radius: 20px; 
    padding: 16px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }

  .panel h2 {
    font-weight: 900; 
    letter-spacing: .3px; 
    text-shadow: 0 2px 8px rgba(0, 0, 0, .4); 
    margin-bottom: 10px; 
  }

  /* ===== LEFT: GAMES ===== */
  .games-stage {
    flex: 1; 
    width: 100%; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: flex-start; 
  }

  .memory-board {
    display: grid; 
    grid-template-columns: repeat(4, var(--cardW-desktop)); 
    grid-auto-rows: var(--cardH-desktop); 
    gap: var(--gap); 
    margin: 0 auto; 
    max-width: calc(4 * var(--cardW-desktop) + 3 * var(--gap)); 
  }

  .card {
    width: var(--cardW-desktop); 
    height: var(--cardH-desktop); 
    perspective: 1000px; 
    border-radius: 14px; 
    position: relative; 
    cursor: pointer; 
  }
  .card-inner {
    position: absolute; 
    inset: 0; 
    border-radius: 14px; 
    transform-style: preserve-3d; 
    transition: transform 480ms cubic-bezier(.2, .65, .2, 1); 
  }
  .card.flip .card-inner { transform: rotateY(180deg); }
  .card.matched { animation: vanish 360ms ease forwards; }
  @keyframes vanish {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.85); opacity: 0; visibility: hidden; }
  }

  .face {
    position: absolute; 
    inset: 0; 
    border-radius: 14px; 
    backface-visibility: hidden; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 10px; 
    text-align: center; 
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, .06); 
  }
  .back {
    background: conic-gradient(from 210deg at 50% 50%, #1a2a6c, #b21f1f, #fdbb2d, #1a2a6c);
  }
  .back .mark {
    font-size: 42px; 
    font-weight: 900; 
    color: #fff; 
  }
  .front { transform: rotateY(180deg); background: #10131a; }
  .front .label { font-weight: 800; font-size: 14px; }

  .intermission {
    margin-top: 14px; 
    padding: 10px 14px; 
    background: rgba(0, 0, 0, .55); 
    border: 1px solid rgba(255, 255, 255, .15); 
    border-radius: 12px; 
    display: none; 
    font-weight: 700; 
  }

  /* Space Invaders */
  #siCanvas {
    width: 100%; 
    max-width: 560px; 
    aspect-ratio: 16 / 10; 
    background: #000; 
    border-radius: 14px; 
    border: 1px solid rgba(255, 255, 255, .15); 
    display: none; 
    margin-top: 10px; 
  }
  .level-badge { margin-top: 10px; font-weight: 800; display: none; }
  .final-message { display: none; margin-top: 12px; font-weight: 700; text-align: center; }

  /* ===== RIGHT: PERSONALITY PATHS ===== */
  .paths {
    width: 100%; 
    flex: 1; 
    display: grid; 
    grid-template-columns: repeat(2, minmax(120px, 1fr)); 
    grid-auto-rows: 120px; 
    gap: 14px; 
    padding: 8px; 
  }
  .path { position: relative; border-radius: 16px; overflow: hidden; text-decoration: none; }
  .path img { width: 100%; height: 100%; object-fit: cover; }
  .path .label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 8px; }
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline>
  <source src="loop-bg.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>

<audio id="bg-music" loop>
  <source src="running out of time.mp3" type="audio/mpeg">
</audio>

<div class="wrap">
  <section class="left">
    <div class="panel">
      <h2>Memory Game</h2>
      <div id="memoryBoard" class="memory-board"></div>
      <div id="intermission" class="intermission">Not yet over…</div>
      <canvas id="siCanvas"></canvas>
      <div id="levelBadge" class="level-badge"></div>
      <div id="finalMsg" class="final-message">
        Congratulations! You finished the journey.<br/><br/>
        Now choose your path on the right 👉
      </div>
    </div>
  </section>

  <section class="right">
    <div class="panel">
      <h2>Choose Your Personality Path</h2>
      <div class="paths">
        <a class="path" href="allout-q1.html"><img src="allout.jpg"/><span class="label">All Out</span></a>
        <a class="path" href="somewhatout-q1.html"><img src="somewhatout.jpg"/><span class="label">Somewhat Out</span></a>
        <a class="path" href="maybe-q1.html"><img src="maybe.jpg"/><span class="label">Maybe</span></a>
        <a class="path" href="never-q1.html"><img src="never.jpg"/><span class="label">Never</span></a>
        <a class="path" href="twosides-q1.html"><img src="twosides.jpg"/><span class="label">Two Sides</span></a>
      </div>
    </div>
  </section>
</div>

<script>
/* MUSIC RESUME */
let hasInteracted=false;
function setupAudio(){
  const audio=document.getElementById('bg-music');
  const saved=localStorage.getItem('music-time');
  if(saved) audio.currentTime=parseFloat(saved);
  audio.play().catch(()=>{});
  setInterval(()=>{if(!audio.paused)localStorage.setItem('music-time',audio.currentTime)},600);
}
window.addEventListener('pointerdown',()=>{if(!hasInteracted){hasInteracted=true;setupAudio();}},{once:true});

/* MEMORY GAME */
const designNames=["Notthebest OG","Initial D","Lorem Ipsum","Your Toast","Grapefruit x Lime","Cake Was A Lie","Berserk","RANDOMODIUM"];
const board=document.getElementById('memoryBoard');let deck=[...designNames,...designNames];shuffle(deck);
let flipped=[],matchedPairs=0;
deck.forEach(name=>{
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<div class="card-inner"><div class="face back"><div class="mark">N</div></div><div class="face front"><div class="label">${name}</div></div></div>`;
  el.addEventListener('click',()=>onFlip(el,name));board.appendChild(el);
});
function onFlip(el,name){
  if(el.classList.contains('flip')||el.classList.contains('matched'))return;
  if(flipped.length===2)return;
  el.classList.add('flip');flipped.push({el,name});
  if(flipped.length===2){
    const[a,b]=flipped;if(a.name===b.name){
      setTimeout(()=>{a.el.classList.add('matched');b.el.classList.add('matched');matchedPairs++;flipped=[];if(matchedPairs===designNames.length)showIntermission();},380);
    }else{setTimeout(()=>{a.el.classList.remove('flip');b.el.classList.remove('flip');flipped=[];},850);}
  }
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}

/* INTERMISSION → SPACE INVADERS */
const siCanvas=document.getElementById('siCanvas');const ctx=siCanvas.getContext('2d');const intermission=document.getElementById('intermission');const levelBadge=document.getElementById('levelBadge');const finalMsg=document.getElementById('finalMsg');
const W=560,H=350;siCanvas.width=W;siCanvas.height=H;
let ship,bullets,aliens,alienDx,keys,tick,levelIndex,animId,playing;
function showIntermission(){intermission.style.display='block';setTimeout(()=>{intermission.style.display='none';startSI();},3000);}
function startSI(){
  board.style.display='none';siCanvas.style.display='block';levelBadge.style.display='block';
  ship={x:W/2,y:H-22,w:28,h:12,speed:5};bullets=[];aliens=[];alienDx=1;keys={};tick=0;levelIndex=0;playing=true;
  setLevel(0);loop();
}
function setLevel(i){
  levelIndex=i;levelBadge.textContent=`Level ${i+1} — ${designNames[i]}`;
  aliens=[];const rows=Math.min(3+Math.floor(i/2),5),cols=10;for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){aliens.push({x:40+c*48,y:40+r*32,w:22,h:14,alive:true});}}
  alienDx=1+i*0.2;
}
function update(){
  if(keys['ArrowLeft'])ship.x=Math.max(6,ship.x-ship.speed);
  if(keys['ArrowRight'])ship.x=Math.min(W-ship.w-6,ship.x+ship.speed);
  bullets.forEach(b=>b.y-=6);bullets=bullets.filter(b=>b.y>-10);
  let minX=Infinity,maxX=-Infinity;aliens.forEach(a=>{if(a.alive){minX=Math.min(minX,a.x);maxX=Math.max(maxX,a.x+a.w);}});
  if(minX===Infinity){if(levelIndex<designNames.length-1){setLevel(levelIndex+1);}else{endSI();return;}}
  else{if(minX<8||maxX>W-8){alienDx=-alienDx;aliens.forEach(a=>a.y+=10);}aliens.forEach(a=>a.x+=alienDx);}
  bullets.forEach(b=>{aliens.forEach(a=>{if(a.alive&&!(a.x+a.w<b.x||b.x+3<a.x||a.y+a.h<b.y||b.y+8<a.y)){a.alive=false;b.y=-20;}});});
}
function draw(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.fillStyle="#7cf3d6";ctx.fillRect(ship.x,ship.y,ship.w,ship.h);ctx.fillRect(ship.x+ship.w*0.35,ship.y-6,ship.w*0.3,6);
  ctx.fillStyle="#ff6f61";bullets.forEach(b=>ctx.fillRect(b.x,b.y,3,8));
  ctx.fillStyle="#ffd966";aliens.forEach(a=>{if(a.alive)ctx.fillRect(a.x,a.y,a.w,a.h);});
}
function loop(){update();draw();if(playing)animId=requestAnimationFrame(loop);}
function endSI(){playing=false;cancelAnimationFrame(animId);levelBadge.style.display='none';finalMsg.style.display='block';}
window.addEventListener('keydown',e=>{if(e.key===' '){bullets.push({x:ship.x+ship.w/2-1.5,y:ship.y-8});}else{keys[e.key]=true;}});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
</script>
</body>
</html>
