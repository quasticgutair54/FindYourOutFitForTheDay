<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Background video */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
      filter: brightness(0.5) blur(3px);
    }

    /* Grid layout */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      grid-column: span 2;
      text-align: center;
      font-size: 22px;
      margin-bottom: 10px;
    }

    /* Tetris section */
    .tetris-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #score {
      font-size: 20px;
      margin-bottom: 10px;
    }

    canvas {
      border: 2px solid white;
      background: black;
      display: block;
    }

    .controls {
      margin-top: 10px;
    }

    .controls button {
      padding: 8px 12px;
      margin: 4px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Personality paths */
    .personality-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 10px;
    }

    .personality-option {
      text-align: center;
      margin: 15px 0;
    }

    .personality-option img {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      margin: 0 auto;
    }

    .personality-option p {
      margin-top: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    /* Mobile */
    @media(max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video autoplay loop muted playsinline id="bgVideo">
    <source src="loop-background.mp4" type="video/mp4">
  </video>

  <!-- Background Music -->
  <audio autoplay loop>
    <source src="background-music.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1>If you want to play this game, go ahead… or click the personalities at the side and choose your outfit.</h1>

    <!-- Left Side: Tetris -->
    <div class="tetris-container">
      <div id="score">Score: 0</div>
      <canvas id="tetris" width="240" height="400"></canvas>
      <div class="controls">
        <button onclick="playerMove(-1)">⬅</button>
        <button onclick="playerDrop()">⬇</button>
        <button onclick="playerMove(1)">➡</button>
        <button onclick="playerRotate(1)">⟳</button>
      </div>
    </div>

    <!-- Right Side: Personalities -->
    <div class="personality-container">
      <div class="personality-option">
        <a href="never_q1.html">
          <img src="never.jpg" alt="Never">
          <p>Never</p>
        </a>
      </div>
      <div class="personality-option">
        <a href="maybe_q1.html">
          <img src="maybe.jpg" alt="Maybe">
          <p>Maybe</p>
        </a>
      </div>
      <div class="personality-option">
        <a href="twosides_q1.html">
          <img src="twosides.jpg" alt="Two Sides">
          <p>Two Sides</p>
        </a>
      </div>
      <div class="personality-option">
        <a href="allout_q1.html">
          <img src="allout.jpg" alt="All Out">
          <p>All Out</p>
        </a>
      </div>
    </div>
  </div>

  <!-- Tetris Game Script -->
  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    let score = 0;
    const scoreElem = document.getElementById('score');

    const matrix = [
      [0,0,0],
      [1,1,1],
      [0,1,0],
    ];

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length -1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        score += rowCount * 10;
        rowCount *= 2;
      }
      scoreElem.innerText = "Score: " + score;
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
              (arena[y + o.y] &&
              arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0,0,0],
          [1,1,1],
          [0,1,0],
        ];
      } else if (type === 'O') {
        return [
          [2,2],
          [2,2],
        ];
      } else if (type === 'L') {
        return [
          [0,3,0],
          [0,3,0],
          [0,3,3],
        ];
      } else if (type === 'J') {
        return [
          [0,4,0],
          [0,4,0],
          [4,4,0],
        ];
      } else if (type === 'I') {
        return [
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
          [0,5,0,0],
        ];
      } else if (type === 'S') {
        return [
          [0,6,6],
          [6,6,0],
          [0,0,0],
        ];
      } else if (type === 'Z') {
        return [
          [7,7,0],
          [0,7,7],
          [0,0,0],
        ];
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, {x:0, y:0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) -
                     (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        score = 0;
        scoreElem.innerText = "Score: " + score;
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
            matrix[y][x],
            matrix[x][y],
          ];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;

    let lastTime = 0;
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }
      draw();
      requestAnimationFrame(update);
    }

    const colors = [
      null,
      'red',
      'yellow',
      'purple',
      'green',
      'blue',
      'orange',
      'pink'
    ];

    const arena = createMatrix(12, 20);
    const player = {
      pos: {x:0, y:0},
      matrix: null,
    };

    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      }
    });

    playerReset();
    update();
  </script>
</body>
</html>
