<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Never Result</title>
  <link href="https://fonts.googleapis.com/css2?family=Tan+Nimbus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz-common.css">
  <style>
    /* Same accent colors as this path's question pages, used only for the
       reveal-photo duotone tint (see .reveal-photo-frame::after) - the core
       background below never uses these. */
    :root { --grad-1: #000000; --grad-2: #ffffff; }

    /* Core background stays exactly what it was before any of this editing -
       the same shared image, same static (non-animated) treatment. The
       outfit photo below is a separate floating element on top of it. */
    html, body {
      background: url('Untitled Design (1).png') no-repeat center center fixed;
      background-size: cover;
      animation: none;
      color: black;
    }
    body::before, body::after {
      content: none;
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="sunshine.mp4" loop></audio>

  <div class="result-stage">
    <div class="reveal-photo-frame">
      <img src="never.jpeg" alt="Never outfit reveal">
    </div>

    <div class="result-box">
      <h1>You're effortlessly cool… and kind of invisible.</h1>
      <p>You don't chase trends — trends quietly hope you'll notice them.<br>
      Comfort is your crown, and subtlety is your sword.</p>
      <p><strong>In the end, it's your decision to choose what you choose. So be you.</strong></p>
      <div class="certified">87% NotTheBest Certified</div>
      <br />
      <a class="cta-button" href="https://www.notthebestplacetobuystuff.in/notthebest-t-shirt" target="_blank">Reveal your outfit</a>
    </div>
  </div>

  <script src="quiz-common.js"></script>
  <script>
    initQuizResult({ pathName: 'never', emoji: '🧼' });
  </script>

</body>
</html>
